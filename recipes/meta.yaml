{% set name = "threaded-generator" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: <PLACEHOLDER_SHA256>

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.12
    - hatchling
    - pip
  run:
    - python >=3.12
    - matplotlib-base

test:
  imports:
    - threaded_generator
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://kwon-young.github.io/threaded-generator/
  summary: Buffer items from an iterable in a separate thread.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kwon-young
